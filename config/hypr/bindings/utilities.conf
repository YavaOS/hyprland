# Menus
bindd = SUPER, SPACE, yavaos menu, exec, yavaos-menu
bindd = SUPER, SLASH, Launch apps, exec, yavaos-launch-walker
bindd = SUPER CTRL, E, Emoji picker, exec, yavaos-launch-walker -m symbols
bindd = SUPER CTRL, C, Capture menu, exec, yavaos-menu capture
bindd = SUPER CTRL, O, Toggle menu, exec, yavaos-menu toggle
bindd = SUPER, ESCAPE, System menu, exec, yavaos-menu system
bindld = , XF86PowerOff, Power menu, exec, yavaos-menu system
bindd = SUPER, K, Show key bindings, exec, yavaos-menu-keybindings
bindd = , XF86Calculator, Calculator, exec, gnome-calculator

# Aesthetics
bindd = SUPER SHIFT, SPACE, Toggle top bar, exec, yavaos-toggle-waybar
bindd = SUPER CTRL, SPACE, Theme background menu, exec, yavaos-menu background
bindd = SUPER SHIFT CTRL, SPACE, Theme menu, exec, yavaos-menu theme
bindd = SUPER, BACKSPACE, Toggle window transparency, exec, hyprctl dispatch setprop "address:$(hyprctl activewindow -j | jq -r '.address')" opaque toggle
bindd = SUPER SHIFT, BACKSPACE, Toggle window gaps, exec, yavaos-hyprland-window-gaps-toggle
bindd = SUPER CTRL, BACKSPACE, Toggle single-window square aspect, exec, yavaos-hyprland-window-single-square-aspect-toggle

# Notifications
bindd = SUPER, COMMA, Dismiss last notification, exec, makoctl dismiss
bindd = SUPER SHIFT, COMMA, Dismiss all notifications, exec, makoctl dismiss --all
bindd = SUPER CTRL, COMMA, Toggle silencing notifications, exec, yavaos-toggle-notification-silencing
bindd = SUPER ALT, COMMA, Invoke last notification, exec, makoctl invoke
bindd = SUPER SHIFT ALT, COMMA, Restore last notification, exec, makoctl restore

# Toggles
bindd = SUPER CTRL, I, Toggle locking on idle, exec, yavaos-toggle-idle
bindd = SUPER CTRL, N, Toggle nightlight, exec, yavaos-toggle-nightlight

# Control Apple Display brightness
bindd = CTRL, F1, Apple Display brightness down, exec, yavaos-brightness-display-apple -5000
bindd = CTRL, F2, Apple Display brightness up, exec, yavaos-brightness-display-apple +5000
bindd = SHIFT CTRL, F2, Apple Display full brightness, exec, yavaos-brightness-display-apple +60000

# Captures
bindd = , PRINT, Screenshot, exec, yavaos-cmd-screenshot
bindd = ALT, PRINT, Screenrecording, exec, yavaos-menu screenrecord
bindd = SUPER, PRINT, Color picker, exec, pkill hyprpicker || hyprpicker -a

# File sharing
bindd = SUPER CTRL, S, Share, exec, yavaos-menu share

# Waybar-less information
bindd = SUPER CTRL ALT, T, Show time, exec, notify-send "    $(date +"%A %H:%M  —  %d %B W%V %Y")"
bindd = SUPER CTRL ALT, B, Show battery remaining, exec, notify-send "$(yavaos-battery-status)"

# Control panels
bindd = SUPER CTRL, A, Audio controls, exec, yavaos-launch-audio
bindd = SUPER CTRL, B, Bluetooth controls, exec, yavaos-launch-bluetooth
bindd = SUPER CTRL, W, Wifi controls, exec, yavaos-launch-wifi
bindd = SUPER CTRL, T, Activity, exec, yavaos-launch-tui btop

# Dictation
bindd = SUPER CTRL, X, Toggle dictation, exec, voxtype record toggle

# Zoom
bindd = SUPER CTRL, Z, Zoom in, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float + 1')
bindd = SUPER CTRL ALT, Z, Reset zoom, exec, hyprctl keyword cursor:zoom_factor 1

# Lock system
bindd = SUPER, L, Lock system, exec, yavaos-lock-screen

# Monitor Tool
bind = SUPER, P, exec, yavaos-launh-tui yavaos-hyprmon
