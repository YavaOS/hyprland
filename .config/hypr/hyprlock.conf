general {
    ignore_empty_input = true
    disable_loading_bar = true
    hide_cursor = true
}

background {
    monitor =
    path = ~/.config/yavaos/current/background
    color = rgba(30, 30, 46, 1.0)
    blur_passes = 0
    brightness = 0.94
}

animations {
    enabled = false
}

# The rounded glass card follows the SDDM login panel's size and palette.
shape {
    monitor =
    size = 440, 350
    position = 0, 0
    halign = center
    valign = center
    color = rgba(30, 30, 46, 0.73)
    rounding = 24
    border_size = 1
    border_color = rgba(255, 255, 255, 0.44)
    shadow_passes = 4
    shadow_size = 12
    shadow_color = rgba(14, 24, 42, 0.45)
    zindex = 0
}

label {
    monitor =
    text = Welcome back
    color = rgba(245, 224, 220, 1.0)
    font_family = VictorMono Nerd Font
    font_size = 26
    position = 0, 118
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = $USER
    color = rgba(205, 214, 244, 1.0)
    font_family = VictorMono Nerd Font
    font_size = 15
    position = 0, 83
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = PASSWORD
    color = rgba(186, 194, 222, 1.0)
    font_family = VictorMono Nerd Font
    font_size = 11
    position = 0, 23
    halign = center
    valign = center
    zindex = 1
}

input-field {
    monitor =
    size = 368, 48
    position = 0, -20
    halign = center
    valign = center
    rounding = 10
    inner_color = rgba(17, 17, 27, 0.61)
    outer_color = rgba(137, 180, 250, 1.0)
    outline_thickness = 1
    font_family = VictorMono Nerd Font
    font_color = rgba(245, 224, 220, 1.0)
    placeholder_text = Enter password
    check_color = rgba(137, 180, 250, 1.0)
    fail_color = rgba(243, 139, 168, 1.0)
    fail_text = $FAIL ($ATTEMPTS)
    fade_on_empty = false
    zindex = 1
}

label {
    monitor =
    text = Press Enter to unlock
    color = rgba(186, 194, 222, 1.0)
    font_family = VictorMono Nerd Font
    font_size = 12
    position = 0, -91
    halign = center
    valign = center
    zindex = 1
}

auth {
    fingerprint:enabled = true
}
